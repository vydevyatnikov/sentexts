[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentexts"
version = "0.4.1"
description = "Local text storage, reads and explicit uploads with Yandex Object Storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.40.65,<2",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
